name: Compilar APK

on:
  push:
    paths:
      - 'AprendeJuega.zip'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que el ZIP este subido
        id: zip
        run: |
          if [ -f AprendeJuega.zip ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-java@v4
        if: steps.zip.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        if: steps.zip.outputs.ok == 'true'
        run: |
          unzip -q AprendeJuega.zip
          cd AprendeJuega
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AprendeJuega.apk

      - uses: actions/upload-artifact@v4
        if: steps.zip.outputs.ok == 'true'
        with:
          name: AprendeJuega
          path: AprendeJuega.apk

      - name: Publicar en Releases
        if: steps.zip.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aprende y Juega ${{ github.run_number }}
          files: AprendeJuega.apk
